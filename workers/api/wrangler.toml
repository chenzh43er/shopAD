name = "shopad-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CORS_ORIGINS = "http://localhost:5173,http://localhost:5174,https://shopad.pages.dev,https://acomedia.work,https://www.acomedia.work"
# Redis 可选：默认关闭。本地/生产要启用时设为 "true"，并配置 UPSTASH_*
REDIS_ENABLED = "false"
# 后台改商品后通知落地页失效 ISR（密钥用 wrangler secret put STOREFRONT_REVALIDATE_SECRET）
STOREFRONT_REVALIDATE_URLS = "https://www.nusasnack.shop"

# Secrets (set via `wrangler secret put` or `.dev.vars`):
# SUPABASE_URL
# SUPABASE_ANON_KEY          (publishable key sb_publishable_...)
# SUPABASE_SERVICE_ROLE_KEY  (secret key sb_secret_...)
# SUPABASE_JWT_SECRET        (optional)
# UPSTASH_REDIS_REST_URL     (optional; Upstash console)
# UPSTASH_REDIS_REST_TOKEN   (optional)
# STOREFRONT_REVALIDATE_SECRET  (须与落地页 REVALIDATE_SECRET 一致)
# STOREFRONT_REVALIDATE_URLS    (可选；逗号分隔落地页根 URL，未配则用商品域名)
